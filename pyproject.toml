[project]
name = "gexsys"
version = "0.1.0"
description = "NQ/ES options gamma-exposure levels engine, local service and TradingView bridge"
requires-python = ">=3.11"
dependencies = ["tzdata==2025.2"]

[project.scripts]
gexsys = "gexsys.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gexsys*"]
