# Hosted copy of the GEX website on GitHub Pages: free, runs on GitHub's computers, not yours.
# Every run fetches fresh Cboe (15-min delayed) data, ForexFactory and Truth Social, rebuilds the
# site and publishes it. See docs/HOSTING.md.
name: Website

on:
  # How often: while futures trade, each run starts the next one when it finishes (the "next" job at the
  # bottom): about every 3 min in cash hours, every 6 min overnight. GitHub's own schedule is unreliable
  # (it ran the old every-10-min schedule a few times a day), so it is only the backup that restarts the
  # chain if it ever stops, and the hourly refresh when futures are closed. Times are UTC.
  schedule:
    - cron: "4-59/10 22-23 * * 0"  # every 10 min from the Sunday futures open (6 pm ET)
    - cron: "4-59/10 * * * 1-4"    # every 10 min Monday to Thursday, around the clock (Globex + cash)
    - cron: "4-59/10 0-21 * * 5"   # every 10 min Friday until the futures close
    - cron: "7 * * * *"            # every hour otherwise (weekend news, posts, the hourly paste)
  workflow_dispatch:                # "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: write                   # only to push the track record to its own branch (track-record)
  pages: write
  id-token: write
  actions: write                    # only to start the next run (the "next" job)

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # full history: the Indicator page lists recent script changes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # .state = last good result, scheduled payload, recent history and feed caches from earlier runs
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: gex-state-${{ github.run_id }}
          restore-keys: gex-state-
      # The track record lives in the track-record branch: a public, timestamped history of every plan
      # (frozen before the open) and every grade, which no cache eviction can lose.
      - name: Load the track record
        run: |
          if git ls-remote --exit-code --heads origin track-record > /dev/null; then
            git fetch origin track-record
            git worktree add .track FETCH_HEAD
            git -C .track switch -c track-record
          else
            git worktree add --orphan -b track-record .track
          fi
      - run: python -m gexpro --log-level WARNING build-site --out _site --state .state
        env:
          GEXPRO_TRACK_DIR: .track
      - name: Save the track record
        run: |
          cd .track
          git add -A
          if git diff --cached --quiet; then echo "track record unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Track record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin track-record
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: gex-state-${{ github.run_id }}
      # every run saves a new copy (~20 MB); keep only the newest few, or the repository's 10 GB cache fills up
      - name: Delete older state copies
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "${{ github.repository }}" -L 100 --key gex-state- --sort created_at --order desc --json id -q '.[].id' | tail -n +4 | xargs -r -n1 gh cache delete -R "${{ github.repository }}" || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Start the next run while futures trade. Runs that overlap collapse into one (concurrency above keeps
  # at most one waiting), so a scheduled or push run joining in never doubles the chain.
  next:
    needs: [build, deploy]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 370             # may wait up to 6 h for the Sunday open
    steps:
      - name: Wait, then start the next run (while futures trade, or at the Sunday open)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          wait=$(python3 - "$started" <<'PY'
          import sys
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          NY = ZoneInfo("America/New_York")
          now = datetime.now(NY)
          d, t = now.weekday(), now.time()                    # Monday = 0
          # Sunday 6 pm ET to Friday 5 pm ET; the daily 5-6 pm break keeps the chain going
          futures = (d == 6 and t >= time(18)) or d <= 3 or (d == 4 and t < time(17))
          if futures:
              cash = d <= 4 and time(9, 15) <= t < time(16, 15)
              ran = (datetime.now(timezone.utc) - datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))).total_seconds()
              print(max(0, int((180 if cash else 360) - ran)))   # ~45 Yahoo calls a run: faster risks its limits
          else:
              sunday = (now + timedelta(days=(6 - d) % 7)).replace(hour=18, minute=1, second=0, microsecond=0)
              until = (sunday - now).total_seconds()
              print(int(until) if 0 < until < 6 * 3600 - 600 else -1)   # wait for the open only if it is near
          PY
          )
          if [ "$wait" -lt 0 ]; then echo "futures closed: the hourly schedule takes over"; exit 0; fi
          echo "next run in ${wait}s"
          sleep "$wait"
          gh workflow run website.yml --ref main -R "${{ github.repository }}"
